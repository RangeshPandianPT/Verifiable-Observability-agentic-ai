[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verifiable-observability"
version = "0.1.0"
description = "Real-time behavioral verification and cryptographic enforcement framework for multi-turn LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Verifiable Observability Research Team" }
]
keywords = [
    "llm-agents",
    "verification",
    "observability",
    "guardrails",
    "runtime-monitoring",
    "cryptographic-audit",
    "ai-safety",
    "pareto-frontier",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "anthropic>=0.28.0",
    "openai>=1.30.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.9.0",
    "plotly>=5.22.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
lint = [
    "ruff>=0.4.0",
]
typing = [
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/verifiable-observability/verifiable-observability"
Repository = "https://github.com/verifiable-observability/verifiable-observability"
Issues = "https://github.com/verifiable-observability/verifiable-observability/issues"

[project.scripts]
vo = "verifiable_observability.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # function call in argument defaults (fastapi Depends/Query idiom)
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["verifiable_observability"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.wheel]
packages = ["verifiable_observability"]
