[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verifiable-observability"
version = "0.1.0"
description = "Real-time behavioral verification framework for multi-turn LLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "anthropic>=0.28.0",
    "openai>=1.30.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
    "plotly>=5.22.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
vo = "verifiable_observability.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["verifiable_observability"]
